name: APK bauen
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Versionsnummer eintragen
        run: |
          printf '{"version": %s, "repo": "%s"}' "${{ github.run_number }}" "${{ github.repository }}" > www/version.json
      - run: npm install
      - name: Texterkennung in die App packen (funktioniert dann offline)
        run: |
          mkdir -p www/tess/core www/tess/lang
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js www/tess/
          ls node_modules/tesseract.js-core/
          cp node_modules/tesseract.js-core/tesseract-core-*lstm.wasm.js www/tess/core/ 2>/dev/null || cp node_modules/tesseract.js-core/tesseract-core*.wasm.js www/tess/core/
          curl -fsSL -o www/tess/lang/deu.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/deu.traineddata
          gzip -9 www/tess/lang/deu.traineddata
          ls -la www/tess www/tess/core www/tess/lang
      - run: npx cap add android
      - run: npx cap sync android
      - name: Kamera-Berechtigung und Android-SDK 35
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -n "permission\|uses-feature" $M
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/; s/compileSdkVersion = [0-9]+/compileSdkVersion = 35/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 35/' android/variables.gradle
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties
      - name: App-Symbol setzen
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -d android/app/src/main/res/mipmap-$d ] && cp www/icon-512.png android/app/src/main/res/mipmap-$d/$f.png || true
            done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Update-Paket erstellen
        run: |
          cd www && zip -qr ../www.zip . && cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk reRec.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: re rec Version ${{ github.run_number }}
          files: |
            reRec.apk
            www.zip
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: reRec-APK
          path: reRec.apk
