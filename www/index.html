:root{
  --navy:#173a6b; --navy-2:#0f2a4f; --orange:#ef7d1f; --orange-soft:#fdeedf;
  --bg:#f3f5f8; --panel:#ffffff; --ink:#15202e; --muted:#5f6b7a; --line:#dde3ea;
  --ok:#23824a; --ok-soft:#e3f3e9; --warn:#a85d00; --warn-soft:#fff2df; --bad:#b3261e;
  --disp:Manrope,"Segoe UI",system-ui,sans-serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1724; --panel:#172233; --ink:#e8eef6; --muted:#9aa8ba; --line:#28364a; --orange-soft:#3a2a1a; --ok-soft:#173226; --warn-soft:#3a2c17; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1724;--panel:#172233;--ink:#e8eef6;--muted:#9aa8ba;--line:#28364a;--orange-soft:#3a2a1a;--ok-soft:#173226;--warn-soft:#3a2c17;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
/* Kopf */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
.bar img{width:32px;height:32px;border-radius:8px}
.bar .t{font-family:var(--disp);font-weight:700;font-size:18px;flex:1}
.bar .t small{display:block;font-family:var(--body);font-weight:400;font-size:11.5px;opacity:.75}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;min-width:40px;height:40px;display:grid;place-items:center;font-size:18px;cursor:pointer;position:relative}
.ib .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--orange);font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
main{padding:14px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(14px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
/* Kamera */
#cam{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover}
#cam .frame{position:absolute;left:8%;right:8%;top:calc(env(safe-area-inset-top,0px) + 70px);bottom:150px;border:2px solid rgba(255,255,255,.55);border-radius:14px;pointer-events:none}
#cam .frame::before,#cam .frame::after{content:"";position:absolute;width:38px;height:38px;border:5px solid var(--orange)}
#cam .frame::before{left:-4px;top:-4px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
#cam .frame::after{right:-4px;bottom:-4px;border-left:0;border-top:0;border-radius:0 0 12px 0}
#cam .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#cam .top .t{flex:1;font-family:var(--disp);font-weight:700}
#cam .hint{position:absolute;left:0;right:0;bottom:132px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 4px #000}
#cam .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-around;padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:linear-gradient(transparent,rgba(0,0,0,.7))}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:var(--orange);cursor:pointer;box-shadow:0 0 0 3px rgba(0,0,0,.25)}
.shutter:active{transform:scale(.94)}
.side{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:20px;display:grid;place-items:center;cursor:pointer}
.side.on{background:var(--orange)}
#cam .err{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;color:#fff;text-align:center;padding:30px}
/* Karten & Formular */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-family:var(--disp);font-size:19px;margin:0 0 12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.f input,.f select{border:1.5px solid var(--line);background:var(--panel);border-radius:11px;padding:11px 12px;font-size:17px;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus{outline:none;border-color:var(--navy)}
.f.unsure input,.f.unsure select{border-color:var(--orange);background:var(--orange-soft)}
.f .lh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.f .tag{font-size:11.5px;font-weight:600;color:var(--warn)}
.f .tag.ok{color:var(--ok)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:13px 16px;font-weight:600;cursor:pointer;text-align:center}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.or{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.big{width:100%;font-size:17px;padding:15px}
.btn:disabled{opacity:.5}
.thumb{position:relative;border-radius:12px;overflow:hidden;background:#111;margin-bottom:12px}
.thumb img{display:block;width:100%;max-height:300px;object-fit:contain}
.thumb .tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.thumb .tools button{background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:9px;padding:7px 10px;font-size:14px;cursor:pointer}
.ocr{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--orange-soft);color:var(--ink);font-size:14px;margin-bottom:12px}
.ocr .pb{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.1);overflow:hidden}.ocr .pb i{display:block;height:100%;background:var(--orange);width:0;transition:width .3s}
.note{font-size:13.5px;color:var(--muted);line-height:1.45}
.note.warn{background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:10px}
/* Liste */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li img{width:44px;height:56px;object-fit:cover;border-radius:6px;background:#ddd;flex:0 0 auto}
.li .m{flex:1;min-width:0}.li .m b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m span{font-size:13px;color:var(--muted)}
.li .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.li .a small{display:block;font-weight:600;font-size:11.5px}
.st-ok{color:var(--ok)}.st-wait{color:var(--warn)}.st-err{color:var(--bad)}
/* Dialog */
.dlg{position:fixed;inset:0;z-index:30;background:rgba(8,16,28,.55);display:flex;align-items:flex-end;justify-content:center}
.dlg .box{background:var(--panel);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:90vh;overflow:auto}
.sum{width:100%;border-collapse:collapse;margin:6px 0 16px}

function pdfEnc(s){let o='';for(const ch of String(s??'')){let c=ch.codePointAt(0);if(CP1252[ch]!==undefined)c=CP1252[ch];else if(c>255||(c>=128&&c<160))c=63;if(c<32)c=32;o+=String.fromCharCode(c)}return o}

class MiniPDF{

<script>
/* ===== Beleg-Parser: OCR-Text -> Datum, Betrag, MWST, Händler, Kategorie ===== */
const KAT_REGELN=[
  [/tank|benzin|diesel|bleifrei|super\s*95|unleaded|fuel|shell|avia|agrola|migrol|socar|esso|\bbp\b|\beni\b|tamoil|ruedi\s*r|coop\s*pronto|oel|liter|ltr\b|zapfs/i,'Fahrzeug / Benzin'],
  [/park(haus|ing|platz|gebühr|uhr)|parkhaus|parking|ticket\s*nr|einfahrt|ausfahrt/i,'Reise / Spesen'],
  [/\bsbb\b|\böbb\b|bahn|zug|billett|fahrkarte|taxi|uber|vignette|maut|autobahn/i,'Reise / Spesen'],
  [/restaurant|ristorante|pizzeria|gasthaus|gasthof|caf[eé]|bistro|kellner|tisch\s*\d|menu\b|menü|essen|getränk|mineral|bier|kaffee|espresso|cappuccino|trattoria|bäckerei|beck\b|take\s*away|mcdonald|burger/i,'Verpflegung'],
  [/papeterie|büro|office|toner|druckerpapier|papier|ordner|kugelschreiber|tinte|cartridge|post\b|briefmarke/i,'Büro'],
  [/hornbach|jumbo|bauhaus|\bobi\b|hilti|würth|wuerth|werkzeug|schraube|dübel|bohrer|baumarkt|landi|brico/i,'Werkzeug / Material'],
  [/digitec|galaxus|media\s*markt|interdiscount|fust|brack|steg\s*electronics|usb|kabel|adapter|maus|tastatur|monitor/i,'Büro'],
  [/swisscom|sunrise|salt\b|internet|mobile|handy|abo\b/i,'Telefon / Internet'],
  [/hotel|übernachtung|zimmer|booking|airbnb/i,'Reise / Spesen'],
];
const MONATE_TXT={jan:1,feb:2,mär:3,mar:3,apr:4,mai:5,may:5,jun:6,jul:7,aug:8,sep:9,okt:10,oct:10,nov:11,dez:12,dec:12};
function normBetrag(s){
  s=String(s).replace(/[\s'’`´]/g,'');
  // 1.234,50 oder 1,234.50 oder 78.30 oder 78,30
  const m=s.match(/^(\d{1,3}(?:[.,]\d{3})*|\d+)[.,](\d{2})$/);if(!m)return null;
  return +(m[1].replace(/[.,]/g,'')+'.'+m[2]);
}
const BETRAG_RE=/(?<![\d.,])(\d{1,3}(?:['’ ]\d{3})+|\d{1,6})\s?[.,]\s?(\d{2})(?![\d%])/g;
function betraegeIn(line){const out=[];let m;BETRAG_RE.lastIndex=0;while((m=BETRAG_RE.exec(line))){const v=normBetrag(m[1]+'.'+m[2]);if(v!=null)out.push({v,i:m.index})}return out}
function parseBeleg(text,heute){
  heute=heute||new Date();
  const raw=String(text||'').replace(/\r/g,'');
  const lines=raw.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(Boolean);
  const all=lines.join('\n');
  const res={datum:'',betrag:null,mwst:null,mwstSatz:null,waehrung:'CHF',haendler:'',kategorie:'',sicher:{}};
  // ---- Währung
  const eur=/€|\bEUR\b/i.test(all),chf=/\bCHF\b|\bFr\.|\bSFr/i.test(all);
  res.waehrung=eur&&!chf?'EUR':'CHF';
  // ---- Datum
  const cands=[];
  const pushD=(y,m,d,prio)=>{y=+y;if(y<100)y+=2000;m=+m;d=+d;if(m<1||m>12||d<1||d>31||y<2000||y>2099)return;
    const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return;if(dt-heute>2*864e5)return;if(heute-dt>400*864e5)prio-=5;cands.push({iso:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,prio})};
  lines.forEach(l=>{
    const dl=/datum|date|\bdat\b/i.test(l)?3:0;
    let m;const r1=/(?<!\d)(\d{1,2})\s?[.\/-]\s?(\d{1,2})\s?[.\/-]\s?(\d{4}|\d{2})(?!\d)/g;
    while((m=r1.exec(l)))pushD(m[3],m[2],m[1],2+dl+(m[3].length===4?1:0));
    const r2=/(?<!\d)(20\d{2})-(\d{2})-(\d{2})(?!\d)/g;while((m=r2.exec(l)))pushD(m[1],m[2],m[3],2+dl);
    const r3=/(?<!\d)(\d{1,2})\.?\s+(jan|feb|mär|mar|apr|mai|may|jun|jul|aug|sep|okt|oct|nov|dez|dec)[a-zä]*\.?\s+(\d{4})/ig;
    while((m=r3.exec(l)))pushD(m[3],MONATE_TXT[m[2].toLowerCase()],m[1],2+dl);
  });
  if(cands.length){cands.sort((a,b)=>b.prio-a.prio);res.datum=cands[0].iso;res.sicher.datum=cands[0].prio>=2}
  // ---- Total
  const totalKw=/(^|\b)(total|totai|tota1|summe|gesamt|gesamtbetrag|zu\s*zahlen|zahlbetrag|betrag|endbetrag|bar\b|barzahlung|kartenzahlung|karte|twint|visa|mastercard|maestro|ec\b|amount|montant)/i;
  const strongKw=/(total|summe|gesamt|zu\s*zahlen|endbetrag|zahlbetrag)/i;
  const skipKw=/(mwst|mw\s*st|ust|tva|iva|vat|netto|exkl|excl|rabatt|r[üu]ckgeld|wechselgeld|retour|gegeben|erhalten|zwischen|subtotal|zwischensumme|punkte|cumulus|supercard|trinkgeld)/i;
  let best=null;
  lines.forEach((l,i)=>{
    if(!totalKw.test(l)||skipKw.test(l))return;
    let am=betraegeIn(l);
    if(!am.length&&lines[i+1]&&!skipKw.test(lines[i+1]))am=betraegeIn(lines[i+1]);
    if(!am.length)return;
    const v=am[am.length-1].v;let score=strongKw.test(l)?10:5;if(/chf|eur|€|fr\./i.test(l))score+=2;if(/total|summe/i.test(l)&&/chf|eur|€/i.test(l))score+=2;
    score+=i/lines.length; // weiter unten = eher Endsumme
    if(!best||score>best.score||(Math.abs(score-best.score)<1&&v>best.v))best={v,score};
  });
  const alleBetraege=lines.filter(l=>!/(r[üu]ckgeld|wechselgeld|retour|gegeben|erhalten|bar\s*gegeben)/i.test(l)).flatMap(l=>betraegeIn(l).map(x=>x.v)).filter(v=>v>0&&v<100000);
  if(best){res.betrag=best.v;res.sicher.betrag=best.score>=10}
  else if(alleBetraege.length){res.betrag=Math.max(...alleBetraege);res.sicher.betrag=false}
  // ---- MWST
  const mwstLines=lines.map((l,i)=>[l,i]).filter(([l])=>/(mwst|mw\s*st|m\.?w\.?st|ust|tva|iva|vat|steuer)/i.test(l));
  let satz=null;
  for(const [l] of mwstLines){const m=l.match(/(\d{1,2}[.,]\d{1,2}|\d{1,2})\s?%/);if(m){const s=+m[1].replace(',','.');if([8.1,2.6,3.8,7.7,2.5,3.7,20,10,13,19,7].includes(s)){satz=s;break}}}
  if(satz==null){const m=all.match(/(8[.,]1|2[.,]6|3[.,]8|7[.,]7)\s?%/);if(m)satz=+m[1].replace(',','.')}
  res.mwstSatz=satz;
  if(res.betrag!=null&&satz!=null){
    const erwartet=Math.round(res.betrag*satz/(100+satz)*100)/100;
    let treffer=null;
    for(const [l,i] of mwstLines){for(const b of [...betraegeIn(l),...(lines[i+1]?betraegeIn(lines[i+1]):[])]){if(Math.abs(b.v-erwartet)<=0.06&&(treffer==null||Math.abs(b.v-erwartet)<Math.abs(treffer-erwartet)))treffer=b.v}}
    res.mwst=treffer!=null?treffer:erwartet;res.sicher.mwst=treffer!=null;
  }else if(mwstLines.length&&res.betrag!=null){
    // Kein Satz erkannt: kleinster plausibler Betrag auf MWST-Zeile
    const c=mwstLines.flatMap(([l])=>betraegeIn(l).map(x=>x.v)).filter(v=>v>0&&v<res.betrag*0.25);
    if(c.length){res.mwst=Math.min(...c);res.sicher.mwst=false}
  }
  // ---- Händler: erste Zeile mit genug Buchstaben, keine Adresse/Telefon/Datum
  const skipH=/(^\d|\btel\b|\btel\.|telefon|\bfax\b|www\.|http|@|mwst|uid|che-|quittung|beleg|rechnung|kasse|datum|date|bon\b|danke|willkommen|welcome|filiale|str\.|strasse|gasse|weg\b|platz\b|\d{4}\s+[a-zäöü])/i;
  for(const l of lines.slice(0,8)){const letters=(l.match(/[A-Za-zÄÖÜäöüéèàç]/g)||[]).length;if(letters>=3&&letters/l.length>0.5&&!skipH.test(l)){res.haendler=l.replace(/[^\wÄÖÜäöüéèàç&.' -]/g,'').replace(/\s+/g,' ').trim().slice(0,40);break}}
  // ---- Kategorie
  for(const [re,k] of KAT_REGELN){if(re.test(all)){res.kategorie=k;break}}
  return res;
}

/* ---------- Speicher für Warteschlange (IndexedDB) ---------- */
const DB={open(){return new Promise((res,rej)=>{const r=indexedDB.open('re-rec',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async all(){const d=await this.open();return new Promise(res=>{const t=d.transaction('q').objectStore('q').getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([])})},
  async put(v){const d=await this.open();return new Promise(res=>{const t=d.transaction('q','readwrite');t.objectStore('q').put(v);t.oncomplete=()=>res()})},
  async del(id){const d=await this.open();return new Promise(res=>{const t=d.transaction('q','readwrite');t.objectStore('q').delete(id);t.oncomplete=()=>res()})}};

/* ---------- Microsoft-Anmeldung (PKCE, wie Zeiterfassung) ---------- */
const AUTH='https://login.microsoftonline.com/common/oauth2/v2.0';
const SCOPE='Files.ReadWrite offline_access User.Read';
const redirectUri=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const cid=LS.get('clientId','');if(!cid){toast('Bitte zuerst die Anwendungs-ID eintragen.');return}
  const ver=b64url(crypto.getRandomValues(new Uint8Array(32)));const st=uid();
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  sessionStorage.setItem('rr-pkce',JSON.stringify({ver,st}));
  location.href=`${AUTH}/authorize?client_id=${encodeURIComponent(cid)}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri())}&response_mode=query&scope=${encodeURIComponent(SCOPE)}&state=${st}&code_challenge=${ch}&code_challenge_method=S256`;
}
async function tokenReq(body){
  const r=await fetch(`${AUTH}/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||('HTTP '+r.status));
  LS.set('tok',{at:j.access_token,exp:Date.now()+(j.expires_in-120)*1000,rt:j.refresh_token||LS.get('tok',{}).rt});return j.access_token;
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search);if(!p.get('code')&&!p.get('error'))return;
  history.replaceState(null,'',redirectUri());
  if(p.get('error')){toast('Anmeldung abgebrochen: '+(p.get('error_description')||p.get('error')),5000);return}
  const s=JSON.parse(sessionStorage.getItem('rr-pkce')||'{}');sessionStorage.removeItem('rr-pkce');
  if(s.st!==p.get('state'))return toast('Anmeldung ungültig – bitte erneut versuchen.');
  try{await tokenReq({client_id:LS.get('clientId',''),grant_type:'authorization_code',code:p.get('code'),redirect_uri:redirectUri(),code_verifier:s.ver,scope:SCOPE});
    const me=await graph('/me?$select=displayName,userPrincipalName');LS.set('user',me.userPrincipalName||me.displayName||'');toast('Angemeldet');
    if(!LS.get('ordner',''))setTimeout(()=>ordnerSuchen(true),300)}
  catch(e){toast('Anmeldung fehlgeschlagen: '+e.message,6000)}
}
async function token(){
  const t=LS.get('tok',null);if(!t)return null;
  if(t.at&&t.exp>Date.now())return t.at;
  if(!t.rt)return null;
  try{return await tokenReq({client_id:LS.get('clientId',''),grant_type:'refresh_token',refresh_token:t.rt,scope:SCOPE})}
  catch(e){LS.set('tok',null);return null}
}
async function graph(path,opt={}){
  const at=await token();if(!at)throw new Error('nicht angemeldet');
  const r=await fetch('https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+at,...(opt.headers||{})}});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();m=j.error?.message||m}catch(e){}throw new Error(m)}
  const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r;
}
const pfad=p=>p.split('/').filter(Boolean).map(encodeURIComponent).join('/');

/* ---------- re-admin-Ordner finden ---------- */
async function ordnerSuchen(auto){
  const box=$('#ordnerliste');if(box)box.innerHTML='<div class="note">Suche in deinem OneDrive …</div>';
  try{
    const r=await graph(`/me/drive/root/search(q='daten.json')?$select=name,id,parentReference,size`);
    const hits=[];
    for(const it of (r.value||[])){if(it.name!=='daten.json')continue;
      const pp=decodeURIComponent((it.parentReference?.path||'').replace(/^\/drive\/root:?/,''));
      try{const c=await graph(`/me/drive/items/${it.id}/content`);const j=await c.json();if(j&&j.rechnungen&&j.settings)hits.push({path:pp||'/',firma:j.settings.firma||'',kats:[...new Set((j.ausgaben||[]).map(a=>a.kategorie).filter(Boolean))]})}catch(e){}
    }
    if(hits.length===1&&auto){waehleOrdner(hits[0]);return}
    if(!box)return;
    box.innerHTML=hits.length?hits.map((x,i)=>`<button class="btn" style="width:100%;text-align:left;margin-bottom:8px" data-o="${i}"><b>${h(x.path)}</b><br><span class="note">${h(x.firma)}</span></button>`).join('')
      :'<div class="note warn">Kein re-admin-Ordner gefunden. Starte re admin einmal am PC (damit daten.json im OneDrive liegt) oder trage den Pfad unten von Hand ein.</div>';
    box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>waehleOrdner(hits[+b.dataset.o]));
  }catch(e){if(box)box.innerHTML=`<div class="note warn">Suche fehlgeschlagen: ${h(e.message)}</div>`}
}
function waehleOrdner(x){LS.set('ordner',x.path);if(x.kats&&x.kats.length)LS.set('kats',x.kats);toast('Ziel: '+x.path+'/Kassabelege');render();queueLauf()}

/* ---------- Kamera ---------- */
let stream=null,torch=false;
async function kameraStart(){
  const v=$('#vid');if(!v)return;
  if(DEMO||!navigator.mediaDevices?.getUserMedia){camFehler(DEMO?'In der Vorschau gibt es keine Kamera.':'Dieser Browser erlaubt keine Live-Kamera.');return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}},audio:false});v.srcObject=stream;await v.play().catch(()=>{});
    const tr=stream.getVideoTracks()[0];const caps=tr.getCapabilities?.()||{};$('#torch').classList.toggle('hidden',!caps.torch)}
  catch(e){camFehler(e.name==='NotAllowedError'?'Der Kamerazugriff ist nicht erlaubt.':'Kamera nicht verfügbar ('+e.message+').')}
}
function kameraStop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null;torch=false}
function camFehler(t){const e=$('#camerr');if(!e)return;$('#vid').classList.add('hidden');$('.frame')?.classList.add('hidden');$('#cam .hint')?.classList.add('hidden');$('#shot').classList.add('hidden');e.classList.remove('hidden');$('#camerrt').textContent=t}
async function torchToggle(){const tr=stream?.getVideoTracks()[0];if(!tr)return;torch=!torch;try{await tr.applyConstraints({advanced:[{torch}]});$('#torch').classList.toggle('on',torch)}catch(e){toast('Licht nicht verfügbar')}}
async function aufnehmen(){
  const v=$('#vid');if(!v||!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  kameraStop();await bildUebernehmen(c);
}
async function dateiGewaehlt(file){
  if(!file)return;let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){try{bmp=await createImageBitmap(file)}catch(e2){return toast('Bild kann nicht gelesen werden (Format?).')}}
  const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);kameraStop();await bildUebernehmen(c);
}

/* ---------- Bild & Texterkennung ---------- */
let akt=null; // aktueller Beleg {canvas, rot, daten, sicher}
function skaliere(src,max,rot=0){
  const r=((rot%360)+360)%360,sw=src.width,sh=src.height,sc=Math.min(1,max/Math.max(sw,sh));const w=Math.round(sw*sc),hh=Math.round(sh*sc);
  const c=document.createElement('canvas');c.width=r%180?hh:w;c.height=r%180?w:hh;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2,c.height/2);x.rotate(r*Math.PI/180);x.drawImage(src,-w/2,-hh/2,w,hh);return c;
}
function fuerOcr(src){ // Graustufen + Kontrast, ~1800 px
  const c=skaliere(src,1800,0),x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height),a=d.data;
  let mn=255,mx=0;const g=new Uint8ClampedArray(a.length/4);
  for(let i=0,j=0;i<a.length;i+=4,j++){const v=.299*a[i]+.587*a[i+1]+.114*a[i+2];g[j]=v;if(v<mn)mn=v;if(v>mx)mx=v}
  const lo=mn+(mx-mn)*.12,hi=mx-(mx-mn)*.08,f=255/Math.max(1,hi-lo);
  for(let i=0,j=0;i<a.length;i+=4,j++){const v=Math.max(0,Math.min(255,(g[j]-lo)*f));a[i]=a[i+1]=a[i+2]=v}
  x.putImageData(d,0,0);return c;
}
let worker=null;
let tessLokal=null;
async function pruefeLokal(){if(tessLokal!==null)return tessLokal;try{const r=await fetch('tess/worker.min.js',{cache:'no-store'});tessLokal=r.ok&&(r.headers.get('content-type')||'').includes('javascript')}catch(e){tessLokal=false}return tessLokal}
function ladeTesseract(){return new Promise(async(res,rej)=>{if(window.Tesseract)return res();const lokal=await pruefeLokal();const s=document.createElement('script');s.src=lokal?'tess/tesseract.min.js':'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=res;s.onerror=()=>rej(new Error('Texterkennung konnte nicht geladen werden (Internet?)'));document.head.appendChild(s)})}
async function ocr(canvas,prog){
  if(DEMO)return demoOcrText();
  await ladeTesseract();
  if(!worker){const opt={logger:m=>{if(m.status==='recognizing text')prog(m.progress);else prog(null,m.status)}};
    if(await pruefeLokal()){const abs=p=>new URL(p,location.href).href;Object.assign(opt,{workerPath:abs('tess/worker.min.js'),corePath:abs('tess/core'),langPath:abs('tess/lang'),gzip:false})}
    worker=await Tesseract.createWorker('deu',1,opt);await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'})}
  const {data}=await worker.recognize(fuerOcr(canvas));return data.text||'';
}
async function bildUebernehmen(canvas){
  akt={canvas,rot:0,daten:{id:uid(),datum:today(),text:'',kategorie:'',betrag:'',waehrung:'CHF',mwst:''},sicher:{},ocrLaeuft:true,ocrText:''};
  ansicht='form';render();
  const setP=(p,st)=>{const b=$('#ocrbar');const t=$('#ocrt');if(b&&p!=null)b.style.width=Math.round(p*100)+'%';if(t&&st)t.textContent=({'loading tesseract core':'Texterkennung wird geladen …','initializing tesseract':'Texterkennung startet …','loading language traineddata':'Sprachdaten werden geladen …','initializing api':'Texterkennung startet …'})[st]||'Beleg wird gelesen …'};
  try{
    const txt=await ocr(canvas,setP);akt.ocrText=txt;
    const p=parseBeleg(txt,new Date());
    const lern=LS.get('lern',{});const hk=(p.haendler||'').toLowerCase();
    Object.assign(akt.daten,{datum:p.datum||today(),text:p.haendler||'',kategorie:(hk&&lern[hk])||p.kategorie||'',betrag:p.betrag!=null?p.betrag.toFixed(2):'',waehrung:p.waehrung,mwst:p.mwst!=null?p.mwst.toFixed(2):''});
    akt.sicher={datum:!!p.datum&&p.sicher.datum,betrag:p.betrag!=null&&p.sicher.betrag,mwst:p.mwst!=null&&p.sicher.mwst,text:!!p.haendler,kategorie:!!akt.daten.kategorie};
    akt.erkannt=true;
  }catch(e){akt.ocrFehler=e.message}
  akt.ocrLaeuft=false;if(ansicht==='form')render();
}

/* ---------- PDF ---------- */
function belegPdf(d,jpgBin,w,hh){
  const pdf=new MiniPDF();pdf.addPage();const L=40,R=555,top=40;
  pdf.text(L,top+12,'Kassabeleg',{size:14,bold:true});
  pdf.text(R,top+12,(d.waehrung||'CHF')+' '+fmt(d.betrag),{size:14,bold:true,align:'right'});
  pdf.text(L,top+30,[fmtD(d.datum),d.text,d.kategorie].filter(Boolean).join('  ·  '),{size:9.5,color:[.35,.35,.35]});
  pdf.text(R,top+30,d.mwst!==''&&d.mwst!=null?'davon MWST '+fmt(d.mwst):'',{size:9.5,color:[.35,.35,.35],align:'right'});
  pdf.line(L,top+40,R,top+40,.5,[.75,.75,.75]);
  const name=pdf.addImage(jpgBin,w,hh);const aw=R-L,ah=842-top-60-30,sc=Math.min(aw/w,ah/hh);
  pdf.image(L+(aw-w*sc)/2,top+52,w*sc,hh*sc,name);
  pdf.text(L,822,'Erfasst mit re rec am '+new Date().toLocaleString('de-CH'),{size:7.5,color:[.5,.5,.5]});
  const meta=btoa(unescape(encodeURIComponent(JSON.stringify({v:1,...d,erfasst:new Date().toISOString(),app:'re rec '+VERSION}))));
  return pdf.output('%RE-REC-DATA '+meta);
}
async function canvasJpeg(c){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));const u=new Uint8Array(await b.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return s}

/* ---------- Speichern, Warteschlange, Hochladen ---------- */
async function speichern(){
  const d={...akt.daten,betrag:+(+String(akt.daten.betrag).replace(',','.')).toFixed(2),mwst:akt.daten.mwst===''?'':+(+String(akt.daten.mwst).replace(',','.')).toFixed(2)};
  const c=skaliere(akt.canvas,1700,akt.rot);const bin=await canvasJpeg(c);
  const bytes=belegPdf(d,bin,c.width,c.height);
  const name=`${d.datum}_${slug(d.text)}_${d.betrag.toFixed(2)}_${d.id.slice(-4)}.pdf`;
  const th=skaliere(c,160,0).toDataURL('image/jpeg',.6);
  await DB.put({id:d.id,name,blob:new Blob([bytes],{type:'application/pdf'}),meta:d,thumb:th,status:'wartet',zeit:Date.now()});
  if(d.text){const lern=LS.get('lern',{});if(d.kategorie)lern[d.text.toLowerCase()]=d.kategorie;LS.set('lern',lern)}
  akt=null;ansicht='kamera';render();queueLauf(true);
}
let laeuft=false;
async function queueLauf(nachSpeichern){
  if(laeuft)return;laeuft=true;
  try{
    const q=(await DB.all()).filter(x=>x.status!=='ok').sort((a,b)=>a.zeit-b.zeit);
    if(!q.length){if(nachSpeichern)toast('Gespeichert');return}
    if(DEMO){for(const x of q){await new Promise(r=>setTimeout(r,700));x.status='ok';x.ok=Date.now();await DB.put(x)}if(nachSpeichern)toast('✓ In OneDrive abgelegt (Vorschau)');return}
    const ordner=LS.get('ordner','');
    if(!ordner||!(await token())){if(nachSpeichern)toast(!ordner?'Gespeichert – wird hochgeladen, sobald der re-admin-Ordner gewählt ist.':'Gespeichert – wird hochgeladen, sobald du angemeldet bist.',4500);return}
    if(!navigator.onLine){if(nachSpeichern)toast('Kein Internet – der Beleg wird später automatisch hochgeladen.',4000);return}
    let n=0;
    for(const x of q){
      try{await graph(`/me/drive/root:/${pfad(ordner+'/Kassabelege/'+x.name)}:/content?@microsoft.graph.conflictBehavior=rename`,{method:'PUT',headers:{'Content-Type':'application/pdf'},body:x.blob});
        x.status='ok';x.ok=Date.now();x.fehler='';n++}
      catch(e){x.status='fehler';x.fehler=e.message}
      await DB.put(x);
    }
    if(nachSpeichern||n)toast(n?`✓ ${n===1?'Beleg':n+' Belege'} in OneDrive abgelegt`:'Hochladen fehlgeschlagen – wird erneut versucht.',3500);
  }finally{laeuft=false;aufraeumen();if(ansicht!=='form')render()}
}
async function aufraeumen(){const all=await DB.all();const ok=all.filter(x=>x.status==='ok').sort((a,b)=>b.zeit-a.zeit);for(const x of ok.slice(40))await DB.del(x.id)}
window.addEventListener('online',()=>queueLauf());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')queueLauf()});

    $('#s-out')&&($('#s-out').onclick=()=>{LS.set('tok',null);LS.set('user','');render()});
    $('#s-such').onclick=()=>ordnerSuchen(false);
    $('#s-upd')&&($('#s-upd').onclick=e=>appUpdateInstall(e.target));
    $('#s-updchk')&&($('#s-updchk').onclick=()=>appUpdateCheck(true));
    $('#s-pfadok').onclick=()=>{let p=$('#s-pfad').value.trim().replace(/\\/g,'/').replace(/\/+$/,'');if(p&&!p.startsWith('/'))p='/'+p;if(!p)return;waehleOrdner({path:p})};
  }
}

function bestaetigen(){
  const d=akt.daten,b=+String(d.betrag).replace(',','.'),m=d.mwst===''?'':+String(d.mwst).replace(',','.');

    <table class="sum"><tr><td>Datum</td><td>${fmtD(d.datum)}</td></tr><tr><td>Händler / Beschreibung</td><td>${h(d.text)}</td></tr>
    <tr><td>Kategorie</td><td>${h(d.kategorie)||'–'}</td></tr><tr><td>Betrag</td><td>${h(d.waehrung)} ${fmt(b)}</td></tr><tr><td>davon MWST</td><td>${m===''?'–':fmt(m)}</td></tr></table>
    <div class="row"><button class="btn" id="c-no">Korrigieren</button><button class="btn or" id="c-yes">Ja, speichern</button></div></div>`;
  document.body.appendChild(dl);
  dl.querySelector('#c-no').onclick=()=>dl.remove();
  dl.querySelector('#c-yes').onclick=async()=>{dl.querySelector('#c-yes').disabled=true;dl.querySelector('#c-yes').textContent='Speichert …';await speichern();dl.remove()};
}

/* ---------- Android: Live-Update über GitHub-Releases, Zurück-Taste ---------- */
let appUpd=null,appVer=null;
async function appUpdateCheck(manual){
  const U=capPlugin('CapacitorUpdater');if(!U){if(manual)toast('Updates gibt es nur in der Android-App');return}
  try{await U.notifyAppReady()}catch(e){}
  try{appVer=appVer||await (await fetch('version.json',{cache:'no-store'})).json()}catch(e){return}
  if(!appVer||!appVer.repo)return;
  try{const rel=await (await fetch(`https://api.github.com/repos/${appVer.repo}/releases/latest`,{cache:'no-store'})).json();
    const rv=+String(rel.tag_name||'').replace(/^v/,'');const a=(rel.assets||[]).find(x=>x.name==='www.zip');
    if(rv>+appVer.version&&a){appUpd={version:rv,url:a.browser_download_url};if(ansicht!=='form')render()}
    else if(manual)toast('re rec ist aktuell (Version '+appVer.version+')')}
  catch(e){if(manual)toast('Update-Server nicht erreichbar')}
}
async function appUpdateInstall(btn){
  const U=capPlugin('CapacitorUpdater');if(!U||!appUpd)return;
  btn.disabled=true;btn.textContent='Wird geladen …';
  try{const b=await U.download({url:appUpd.url,version:String(appUpd.version)});btn.textContent='Wird installiert …';await U.set({id:b.id})}
  catch(e){btn.disabled=false;btn.textContent='Erneut versuchen';toast('Update fehlgeschlagen')}
}
if(CAP){const A=capPlugin('App');if(A&&A.addListener)A.addListener('backButton',()=>{
  if(document.querySelector('.dlg')){document.querySelector('.dlg').remove();return}
  if(ansicht!=='kamera'){akt=null;ansicht='kamera';render()}else if(A.exitApp)A.exitApp()})}
(async()=>{await handleRedirect();render();queueLauf();if(CAP){appUpdateCheck(false);setInterval(()=>appUpdateCheck(false),6*3600e3)}})();
